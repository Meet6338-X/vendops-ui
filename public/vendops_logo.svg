<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid accent lines -->
  <path d="M 0 60 H 800 M 0 120 H 800 M 0 180 H 800" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.4" />
  <path d="M 160 0 V 240 M 320 0 V 240 M 480 0 V 240 M 640 0 V 240" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.4" />

  <!-- Logo Icon: Hexagonal Shield & Agent Graph -->
  <g transform="translate(48, 40)">
    <!-- Outer Shield Hexagon -->
    <polygon points="80,10 145,45 145,115 80,150 15,115 15,45" fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Graph Edges -->
    <line x1="80" y1="40" x2="45" y2="75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="80" y1="40" x2="115" y2="75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="45" y1="75" x2="80" y2="120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="115" y1="75" x2="80" y2="120" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="80" y1="40" x2="80" y2="120" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    
    <!-- Graph Nodes -->
    <circle cx="80" cy="40" r="7" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="45" cy="75" r="5.5" fill="#38bdf8" />
    <circle cx="115" cy="75" r="5.5" fill="#38bdf8" />
    <circle cx="80" cy="120" r="8" fill="#4facfe" filter="url(#glow)" />
    <circle cx="80" cy="80" r="4" fill="#ffffff" />
    
    <!-- Central Verification Tick -->
    <path d="M 74 80 L 78 84 L 88 74" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(240, 95)">
    <!-- Main Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#glowGrad)" letter-spacing="1.5">
      Vend<tspan fill="#f8fafc">Ops</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="2">
      AUTONOMOUS AGENTIC DISPUTE HARNESS
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 68)">
      <rect width="96" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="48" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">LangGraph</text>

      <rect x="108" width="80" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="148" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">MCP 2.x</text>

      <rect x="200" width="108" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="254" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Zero-Halluc</text>

      <rect x="320" width="84" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="362" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">FastAPI</text>

      <rect x="416" width="76" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="454" y="16" font-family="monospace" font-size="11" font-weight="600" fill="#f43f5e" text-anchor="middle">Qdrant</text>
    </g>
  </g>
</svg>
